<body class="smooth-scroll-yes">

  <!-- Reusable Header -->
  <div id="site-header"></div>
  <script src="assets/js/header-component.js"></script>

  <!-- Content injected here -->
  <div id="article-root"></div>

  <div id="site-footer"></div>
  <script src="assets/js/footer-component.js"></script>

  <script src="assets/js/blog-data.js"></script>

  <script>
    /* ── Get post ID from URL ── */
    const params = new URLSearchParams(window.location.search);
    const postId = parseInt(params.get("id"));
    const post = BLOG_DATA.find(b => b.id === postId);
    const root = document.getElementById("article-root");

    if (!post) {
      root.innerHTML = `
        <div class="not-found">
          <i class="fa-solid fa-newspaper"></i>
          <h2>Post Not Found</h2>
          <p>The blog post you're looking for doesn't exist or has been removed.</p>
          <a href="blog.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Back to Blog</a>
        </div>
      `;
    } else {

      /* Update page title */
      // document.title = `${post.title} – Career Future`;

      /* Build paragraphs — middle one gets pull-quote style */
      const paraHTML = post.paragraphs.map((p, i) => {
        if (i === 1 && post.paragraphs.length >= 2) {
          // Second paragraph as pull quote (first sentence) + rest as normal
          const sentences = p.split('. ');
          const quote = sentences[0] + '.';
          const rest = sentences.slice(1).join('. ');
          return `
            <blockquote class="pull-quote">${quote}</blockquote>
            ${rest ? `<p>${rest}</p>` : ''}
          `;
        }
        return `<p>${p}</p>`;
      }).join('');

      /* Related posts (same category, exclude current) */
      const related = BLOG_DATA
        .filter(b => b.category === post.category && b.id !== post.id)
        .slice(0, 2);

      const relatedHTML = related.length > 0 ? `
        <div class="related-section">
          <div class="related-heading">More in ${post.category}</div>
          <div class="related-grid">
            ${related.map(r => `
              <div class="related-card" onclick="window.location.href='blog-detail.html?id=${r.id}'">
                <div class="related-thumb">
                  ${r.image
          ? `<img src="${r.image}" alt="${r.title}" onerror="this.parentElement.innerHTML='<div class=no-img><i class=\\'fa-solid fa-newspaper\\'></i></div>'">`
          : `<div class="no-img"><i class="fa-solid fa-newspaper"></i></div>`}
                </div>
                <div class="related-info">
                  <div class="cat">${r.category}</div>
                  <h5>${r.title}</h5>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      ` : '';

      root.innerHTML = `
        <!-- Article Hero -->
        <div class="article-hero">
          <div class="article-hero-inner">
            <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:20px;">
              <span class="article-category" style="margin-bottom:0;">${post.category}</span>
              <a href="blog.html" class="view-all-blogs-btn">
                <i class="fa-solid fa-arrow-left"></i> View All Blogs
              </a>
            </div>
            <h1 class="article-title">${post.title}</h1>
            <div class="article-meta">
              <span><i class="fa-regular fa-calendar"></i> ${post.date}</span>
              <span><i class="fa-regular fa-user"></i> ${post.author}</span>
              <span><i class="fa-regular fa-clock"></i> ${Math.ceil(post.paragraphs.join(' ').split(' ').length / 200)} min read</span>
            </div>
          </div>
          <div class="article-image-wrap">
            ${post.image
          ? `<img src="${post.image}" alt="${post.title}" onerror="this.outerHTML='<div class=no-hero-img><i class=\\'fa-solid fa-newspaper\\'></i></div>'">`
          : `<div class="no-hero-img"><i class="fa-solid fa-newspaper"></i></div>`}
          </div>
        </div>

        <!-- Article Body -->
        <article class="article-body">
          <div class="share-bar">
            <span class="share-label">Share</span>
            <button class="share-btn" title="Copy link" onclick="copyLink()"><i class="fa-solid fa-link"></i></button>
            <button class="share-btn" title="Share on WhatsApp" onclick="shareWhatsApp()"><i class="fa-brands fa-whatsapp"></i></button>
            <button class="share-btn" title="Share on Twitter" onclick="shareTwitter()"><i class="fa-brands fa-x-twitter"></i></button>
          </div>
          ${paraHTML}
        </article>

        ${relatedHTML}
      `;
    }

    /* ── Share helpers ── */
    function copyLink() {
      navigator.clipboard.writeText(window.location.href).then(() => {
        alert("Link copied to clipboard!");
      });
    }

    function shareWhatsApp() {
      const text = encodeURIComponent(`${post?.title} – ${window.location.href}`);
      window.open(`https://wa.me/?text=${text}`, "_blank");
    }

    function shareTwitter() {
      const text = encodeURIComponent(post?.title || "");
      const url = encodeURIComponent(window.location.href);
      window.open(`https://twitter.com/intent/tweet?text=${text}&url=${url}`, "_blank");
    }
  </script>
