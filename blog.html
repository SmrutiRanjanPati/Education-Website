<body class="smooth-scroll-yes">

  <!-- Reusable Header -->
  <div id="site-header"></div>
  <script src="assets/js/header-component.js"></script>

  <!-- Hero -->
  <section class="blog-hero">
    <div class="blog-hero-label">The Career Future Journal</div>
    <h1>Insights, Guides &amp; Career Stories</h1>
    <p>Expert advice on admissions, courses, and building your future in India's top universities.</p>
  </section>

  <!-- Filter Bar -->
  <nav class="filter-bar" id="filterBar">
    <button class="filter-btn active" data-filter="all">All</button>
    <!-- Category buttons injected by JS -->
  </nav>

  <!-- Main Content -->
  <main class="blog-container">
    <!-- Featured post -->
    <div id="featuredPost"></div>

    <!-- Divider -->
    <div class="section-rule">
      <h3>More Stories</h3>
    </div>

    <!-- Cards grid -->
    <div class="cards-grid" id="cardsGrid"></div>

    <!-- No results -->
    <div class="no-results" id="noResults">
      <i class="fa-solid fa-newspaper"></i>
      <p>No posts found in this category.</p>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/footer-component.js"></script>

  <!-- Load blog data -->
  <script src="assets/js/blog-data.js"></script>

  <script>
    let activeFilter = "all";

    /* ── Build category filter buttons ── */
    function buildFilters() {
      const bar = document.getElementById("filterBar");
      const cats = [...new Set(BLOG_DATA.map(b => b.category))];
      cats.forEach(cat => {
        const btn = document.createElement("button");
        btn.className = "filter-btn";
        btn.dataset.filter = cat;
        btn.textContent = cat;
        btn.addEventListener("click", () => applyFilter(cat, btn));
        bar.appendChild(btn);
      });

      bar.addEventListener("click", e => {
        if (e.target.dataset.filter === "all") {
          applyFilter("all", e.target);
        }
      });
    }

    function applyFilter(filter, btn) {
      activeFilter = filter;
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderPosts();
    }

    /* ── Render ── */
    function renderPosts() {
      const filtered = activeFilter === "all"
        ? BLOG_DATA
        : BLOG_DATA.filter(b => b.category === activeFilter);


      // Sort by highest ID first
      filtered.sort((a, b) => b.id - a.id);

      const featured = filtered[0] || null;
      const rest = filtered.slice(1);

      renderFeatured(featured);
      renderCards(rest);

      document.getElementById("noResults").style.display =
        filtered.length === 0 ? "block" : "none";
      document.querySelector(".section-rule").style.display =
        rest.length === 0 ? "none" : "flex";
    }

    function renderFeatured(post) {
      const el = document.getElementById("featuredPost");
      if (!post) { el.innerHTML = ""; return; }

      el.innerHTML = `
        <div class="featured-post" onclick="goToPost(${post.id})">
          <div class="featured-img">
            ${post.image
          ? `<img src="${post.image}" alt="${post.title}" onerror="this.parentElement.innerHTML='<div class=no-img><i class=\\'fa-solid fa-newspaper\\'></i></div>'">`
          : `<div class="no-img"><i class="fa-solid fa-newspaper"></i></div>`}
          </div>
          <div class="featured-content">
            <span class="post-category">${post.category}</span>
            <h2>${post.title}</h2>
            <p class="excerpt">${post.excerpt}</p>
            <div class="post-meta">
              <span><i class="fa-regular fa-calendar"></i> ${post.date}</span>
              <span><i class="fa-regular fa-user"></i> ${post.author}</span>
            </div>
            <span class="read-more-btn">Read Full Story <i class="fa-solid fa-arrow-right"></i></span>
          </div>
        </div>
      `;
    }

    function renderCards(posts) {
      const grid = document.getElementById("cardsGrid");
      grid.innerHTML = posts.map(post => `
        <div class="blog-card" onclick="goToPost(${post.id})">
          <div class="card-img">
            ${post.image
          ? `<img src="${post.image}" alt="${post.title}" onerror="this.parentElement.innerHTML='<div class=no-img><i class=\\'fa-solid fa-newspaper\\'></i></div>'">`
          : `<div class="no-img"><i class="fa-solid fa-newspaper"></i></div>`}
          </div>
          <div class="card-body">
            <span class="post-category">${post.category}</span>
            <h4>${post.title}</h4>
            <p class="excerpt">${post.excerpt}</p>
            <div class="card-footer">
              <span class="card-date"><i class="fa-regular fa-calendar"></i> ${post.date}</span>
              <span class="card-arrow"><i class="fa-solid fa-arrow-right"></i></span>
            </div>
          </div>
        </div>
      `).join("");
    }

    /* ── Navigate to detail page ── */
    function goToPost(id) {
      window.location.href = `blog-detail.html?id=${id}`;
    }

    /* ── Init ── */
    buildFilters();
    renderPosts();
  </script>
